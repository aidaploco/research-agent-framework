[project]
name = "research-agent-framework"
version = "0.1.0"
description = "Multi-tool research agent: plans, searches Wikipedia/arXiv/FRED, and synthesizes cited answers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.4",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# Long lines are prompt strings; `ruff format` owns code line length.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
